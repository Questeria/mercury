[package]
name = "mercury-app-server"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

# Milestone 3 of launch integration: a DEV-ONLY HTTP shim over the mercury-app
# controller, so a browser-based UI (Vite dev) can drive REAL end-to-end-encrypted
# messaging over `POST /command` instead of the in-app TypeScript simulator.
#
# DEV-ONLY, by design: this process HOLDS the message keys (one in-memory
# AppController) and exposes send/receive over loopback HTTP. The PRODUCTION
# exposure is Tauri in-process IPC (no open port), not this shim -- exactly as
# mercury-ui-bridge is a dev decision-view shim, not the production transport.

[lib]
name = "mercury_app_server"
path = "src/lib.rs"

[[bin]]
name = "mercury-app-server"
path = "src/main.rs"

[dependencies]
mercury-app = { path = "../mercury-app" }
mercury-client = { path = "../mercury-client" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
getrandom = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
