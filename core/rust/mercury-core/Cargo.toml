[package]
name = "mercury-core"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
mercury-policy = { path = "../mercury-policy" }
serde = { version = "1", default-features = false, optional = true }
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
