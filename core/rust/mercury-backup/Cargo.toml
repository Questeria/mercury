[package]
name = "mercury-backup"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

# Stage 9 secure-backup engine. Derives a backup key from a high-entropy recovery
# code via Argon2id, encrypts a backup archive (XChaCha20-Poly1305 + BLAKE3
# manifest), and PRODUCES the inputs for mercury-core's backup/recovery policy
# gates (evaluate_account_recovery -> evaluate_secure_backup_restore) -- the
# engine does the crypto; the gates decide policy. Mirrors how mercury-mls feeds
# the MLS gates. Only audited RustCrypto/BLAKE3 primitives; nothing hand-rolled.

[dependencies]
mercury-core = { path = "../mercury-core" }
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
subtle = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
